databases:
  - name: webchat-db
    plan: free
    databaseName: webchat
    user: webchat

services:
  - type: web
    name: webchat
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: webchat-db
          property: connectionString
