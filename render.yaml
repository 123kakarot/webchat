databases:
  - name: webchat-db
    plan: free
    databaseName: webchat
    user: webchat

services:
  - type: web
    name: webchat
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev || npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: webchat-db
          property: connectionString
